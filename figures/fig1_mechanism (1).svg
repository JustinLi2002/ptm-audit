<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#1F7FC4"/>
  </marker>
  <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#D2691E"/>
  </marker>
</defs>
<rect width="1240" height="900" fill="#FFFFFF"/>

<!-- ══════════════ (a) ══════════════ -->
<text x="40" y="42" font-size="21" font-weight="bold" fill="#222">(a)</text>
<text x="78" y="42" font-size="16" font-weight="bold" fill="#444">Sampling threshold creates label-homogeneous proteins</text>

<rect x="70" y="72" width="380" height="42" rx="5" fill="#DEDEDE" stroke="#9A9A9A"/>
<text x="260" y="99" font-size="14" text-anchor="middle" fill="#333">Protein P</text>
<line x1="160" y1="114" x2="160" y2="142" stroke="#9A9A9A"/>
<line x1="360" y1="114" x2="360" y2="142" stroke="#9A9A9A"/>
<circle cx="160" cy="156" r="13" fill="#333"/><text x="160" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<circle cx="360" cy="156" r="13" fill="#333"/><text x="360" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<text x="160" y="188" font-size="12" text-anchor="middle" fill="#777">site 1</text>
<text x="360" y="188" font-size="12" text-anchor="middle" fill="#777">site 2</text>

<rect x="70" y="208" width="380" height="34" rx="5" fill="#FDF6DC" stroke="#DDAE2E"/>
<text x="260" y="230" font-size="12" text-anchor="middle" fill="#6B5310">2 sites, below the donor threshold &#8594; no negatives drawn</text>
<text x="260" y="272" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Every site of P carries the same label</text>
<text x="260" y="294" font-size="13" font-style="italic" text-anchor="middle" fill="#777">P is label-homogeneous</text>

<!-- ══════════════ (b) ══════════════ -->
<text x="660" y="42" font-size="21" font-weight="bold" fill="#222">(b)</text>
<text x="698" y="42" font-size="16" font-weight="bold" fill="#444">A protein-level feature is constant within P</text>

<rect x="690" y="72" width="86" height="48" rx="5" fill="#1F7FC4"/>
<text x="733" y="92" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">128-dim</text>
<text x="733" y="108" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">vector</text>

<rect x="820" y="72" width="330" height="42" rx="5" fill="#DEDEDE" stroke="#9A9A9A"/>
<text x="985" y="99" font-size="14" text-anchor="middle" fill="#333">Protein P</text>
<line x1="900" y1="114" x2="900" y2="142" stroke="#9A9A9A"/>
<line x1="1070" y1="114" x2="1070" y2="142" stroke="#9A9A9A"/>
<circle cx="900" cy="156" r="13" fill="#333"/><text x="900" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<circle cx="1070" cy="156" r="13" fill="#333"/><text x="1070" y="161" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">+</text>

<path d="M776,102 C806,102 850,140 884,154" fill="none" stroke="#1F7FC4" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M776,110 C812,132 1000,178 1054,162" fill="none" stroke="#1F7FC4" stroke-width="1.7" marker-end="url(#ar)"/>

<text x="920" y="212" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F7FC4">the same vector is attached to every candidate site</text>
<text x="920" y="234" font-size="13" text-anchor="middle" fill="#777">it distinguishes proteins, never sites within a protein</text>

<!-- ══════════════ (c) ══════════════ -->
<text x="40" y="392" font-size="21" font-weight="bold" fill="#222">(c)</text>
<text x="78" y="392" font-size="16" font-weight="bold" fill="#444">Site-level split &#8212; the vector becomes a key</text>

<rect x="60" y="416" width="500" height="152" rx="7" fill="#F4F4F4" stroke="#9A9A9A"/>
<text x="80" y="440" font-size="12" font-weight="bold" fill="#666" letter-spacing="1">TRAINING SET</text>
<rect x="80" y="454" width="182" height="34" rx="5" fill="#FDF6DC" stroke="#DDAE2E"/>
<text x="171" y="476" font-size="13" text-anchor="middle" fill="#6B5310">Protein P</text>
<line x1="130" y1="488" x2="130" y2="506" stroke="#B9A05A"/>
<line x1="212" y1="488" x2="212" y2="506" stroke="#B9A05A"/>
<circle cx="130" cy="518" r="11" fill="#333"/><text x="130" y="523" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<circle cx="212" cy="518" r="11" fill="#333"/><text x="212" y="523" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<text x="171" y="551" font-size="12" text-anchor="middle" fill="#555">labels: + , +</text>
<rect x="316" y="454" width="76" height="42" rx="5" fill="#1F7FC4"/>
<text x="354" y="471" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">128-dim</text>
<text x="354" y="486" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">vector</text>
<rect x="424" y="454" width="112" height="42" rx="5" fill="#EDEDED" stroke="#C4C4C4" stroke-dasharray="3 3"/>
<text x="480" y="479" font-size="12" text-anchor="middle" fill="#AAA">other proteins</text>

<rect x="60" y="600" width="500" height="152" rx="7" fill="#FAFAFA" stroke="#9A9A9A" stroke-dasharray="6 4"/>
<text x="80" y="624" font-size="12" font-weight="bold" fill="#666" letter-spacing="1">TEST SET</text>
<rect x="80" y="638" width="182" height="34" rx="5" fill="#FDF6DC" stroke="#DDAE2E"/>
<text x="171" y="660" font-size="13" text-anchor="middle" fill="#6B5310">Protein P</text>
<line x1="130" y1="672" x2="130" y2="690" stroke="#B9A05A"/>
<line x1="212" y1="672" x2="212" y2="690" stroke="#B9A05A"/>
<circle cx="130" cy="702" r="11" fill="#333"/><text x="130" y="707" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
<circle cx="212" cy="702" r="11" fill="#333"/><text x="212" y="707" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
<rect x="316" y="638" width="76" height="42" rx="5" fill="#1F7FC4"/>
<text x="354" y="655" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">128-dim</text>
<text x="354" y="670" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">vector</text>

<path d="M354,638 L354,496" fill="none" stroke="#D2691E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aro)"/>
<rect x="404" y="546" width="140" height="26" rx="4" fill="#fff" stroke="#D2691E"/>
<text x="474" y="564" font-size="12" font-weight="bold" text-anchor="middle" fill="#D2691E">identical vector</text>
<text x="171" y="737" font-size="12" font-weight="bold" text-anchor="middle" fill="#D2691E">predicted: + , +</text>
<text x="310" y="782" font-size="13" font-weight="bold" text-anchor="middle" fill="#D2691E">P appears in both partitions &#8594; the vector recalls its labels</text>

<!-- ══════════════ (d) ══════════════ -->
<text x="660" y="392" font-size="21" font-weight="bold" fill="#222">(d)</text>
<text x="698" y="392" font-size="16" font-weight="bold" fill="#444">Protein-disjoint split &#8212; the key opens nothing</text>

<rect x="680" y="416" width="500" height="152" rx="7" fill="#F4F4F4" stroke="#9A9A9A"/>
<text x="700" y="440" font-size="12" font-weight="bold" fill="#666" letter-spacing="1">TRAINING SET</text>
<rect x="700" y="454" width="182" height="34" rx="5" fill="#FDF6DC" stroke="#DDAE2E"/>
<text x="791" y="476" font-size="13" text-anchor="middle" fill="#6B5310">Protein P</text>
<line x1="750" y1="488" x2="750" y2="506" stroke="#B9A05A"/>
<line x1="832" y1="488" x2="832" y2="506" stroke="#B9A05A"/>
<circle cx="750" cy="518" r="11" fill="#333"/><text x="750" y="523" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<circle cx="832" cy="518" r="11" fill="#333"/><text x="832" y="523" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<text x="791" y="551" font-size="12" text-anchor="middle" fill="#555">labels: + , +</text>
<rect x="936" y="454" width="76" height="42" rx="5" fill="#1F7FC4"/>
<text x="974" y="471" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">128-dim</text>
<text x="974" y="486" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">vector</text>
<rect x="1044" y="454" width="112" height="42" rx="5" fill="#EDEDED" stroke="#C4C4C4" stroke-dasharray="3 3"/>
<text x="1100" y="479" font-size="12" text-anchor="middle" fill="#AAA">other proteins</text>

<rect x="680" y="600" width="500" height="152" rx="7" fill="#FAFAFA" stroke="#9A9A9A" stroke-dasharray="6 4"/>
<text x="700" y="624" font-size="12" font-weight="bold" fill="#666" letter-spacing="1">TEST SET</text>
<rect x="700" y="638" width="182" height="34" rx="5" fill="#E5F3E3" stroke="#7BA877"/>
<text x="791" y="660" font-size="13" text-anchor="middle" fill="#33632E">Protein Q</text>
<line x1="750" y1="672" x2="750" y2="690" stroke="#7BA877"/>
<line x1="832" y1="672" x2="832" y2="690" stroke="#7BA877"/>
<circle cx="750" cy="702" r="11" fill="#333"/><text x="750" y="707" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
<circle cx="832" cy="702" r="11" fill="#333"/><text x="832" y="707" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">?</text>
<rect x="936" y="638" width="76" height="42" rx="5" fill="#1F7FC4"/>
<text x="974" y="655" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">128-dim</text>
<text x="974" y="670" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">vector</text>
<text x="974" y="700" font-size="11" text-anchor="middle" fill="#888">(vector of Q &#8212; exists)</text>

<path d="M974,638 L974,500" fill="none" stroke="#D2691E" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="954" y1="589" x2="994" y2="549" stroke="#C0392B" stroke-width="3.4"/>
<line x1="954" y1="549" x2="994" y2="589" stroke="#C0392B" stroke-width="3.4"/>
<rect x="1020" y="552" width="132" height="26" rx="4" fill="#fff" stroke="#C0392B"/>
<text x="1086" y="570" font-size="12" font-weight="bold" text-anchor="middle" fill="#C0392B">different vector</text>
<text x="930" y="782" font-size="13" font-weight="bold" text-anchor="middle" fill="#C0392B">Q never appears in training &#8594; its vector recalls no label</text>

<line x1="620" y1="30" x2="620" y2="330" stroke="#DDD" stroke-dasharray="4 5"/>
<line x1="620" y1="380" x2="620" y2="800" stroke="#DDD" stroke-dasharray="4 5"/>
<line x1="40" y1="356" x2="1200" y2="356" stroke="#DDD" stroke-dasharray="4 5"/>
</svg>
